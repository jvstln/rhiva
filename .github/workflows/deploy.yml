name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy_www:
    runs-on: ubuntu-latest
    name: Deploy www
    steps:
      - uses: ./.github/actions/cloudflare
        with:
          path: "apps/www"
          githubToken: ${{ secrets.SUBMODULE_GITHUB_TOKEN }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          envVars: |
            {
              "PUBLISH_TOKEN": "${{ secrets.PUBLISH_TOKEN }}",
              "NEXT_PUBLIC_JITO_UUID": "${{ secrets.NEXT_PUBLIC_JITO_UUID }}",
              "NEXT_PUBLIC_JITO_API_URL": "${{ secrets.NEXT_PUBLIC_JITO_API_URL }}",

              "NEXT_PUBLIC_API_URL": "${{ secrets.NEXT_PUBLIC_API_URL }}",
              "NEXT_PUBLIC_BASE_URL": "${{ secrets.NEXT_PUBLIC_BASE_URL }}",
              "NEXT_PUBLIC_MEDIA_URL": "${{ secrets.NEXT_PUBLIC_MEDIA_URL }}",
              "NEXT_PUBLIC_VAPID_KEY": "${{ secrets.NEXT_PUBLIC_VAPID_KEY }}",
              "NEXT_PUBLIC_WORKER_BASE_URL": "${{ secrets.NEXT_PUBLIC_WORKER_BASE_URL }}",


              "NEXT_PUBLIC_HELIUS_API_URL": "${{ secrets.NEXT_PUBLIC_HELIUS_API_URL }}",
              "NEXT_PUBLIC_HELIUS_API_KEY": "${{ secrets.NEXT_PUBLIC_HELIUS_API_KEY }}",
              "NEXT_PUBLIC_SOLANA_RPC_URL": "${{ secrets.NEXT_PUBLIC_SOLANA_RPC_URL }}",

              "NEXT_PUBLIC_JUPITER_API_URL": "${{ secrets.NEXT_PUBLIC_JUPITER_API_URL }}",
              "NEXT_PUBLIC_JUPITER_DATA_API_URL": "${{ secrets.NEXT_PUBLIC_JUPITER_DATA_API_URL }}",
              "NEXT_PUBLIC_JUPITER_API_KEY": "${{ secrets.NEXT_PUBLIC_JUPITER_API_KEY }}",

              "NEXT_PUBLIC_PRIVY_APP_ID": "${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}",
              "NEXT_PUBLIC_PRIVY_SIGNER_ID": "${{ secrets.NEXT_PUBLIC_PRIVY_SIGNER_ID }}",

              "NEXT_POSTHOG_PROJECT_ID": "${{ secrets.NEXT_POSTHOG_PROJECT_ID }}",
              "NEXT_PUBLIC_POSTHOG_KEY": "${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}",
              "NEXT_PUBLIC_POSTHOG_HOST": "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}",
              "NEXT_POSTHOG_PERSONAL_API_KEY": "${{ secrets.NEXT_POSTHOG_PERSONAL_API_KEY }}"
            }
